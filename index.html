<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8mm</title>
  <meta name="description" content="Eight perspectives. One rating.">
  <meta name="theme-color" content="#F6F2E8">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="8mm">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1 class="wordmark">8mm<span class="wordmark__dot">.</span></h1>
      <p class="tagline">Eight perspectives. One rating.</p>
    </header>

    <section class="reading" aria-label="Your rating">
      <div class="reading__top">
        <p class="score" id="score">
          <span class="score__figure" id="score-figure">&mdash;</span>
          <span class="score__scale">/ 5</span>
        </p>
        <div class="stars" id="stars" aria-hidden="true"></div>
      </div>
      <div class="strip" id="strip" aria-hidden="true"></div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <form class="criteria" id="criteria" aria-label="Criteria"></form>

    <footer class="actions">
      <button class="button button--primary" id="copy" type="button" disabled>Copy rating</button>
      <button class="button button--quiet" id="reset" type="button">Reset</button>
    </footer>
    <p class="shortcut-hint">Tip: type 0, 5 or 1 to score each criterion in order.</p>
  </div>
</body>
</html>
